    <rect x="0" y="0" width="794" height="10" fill="#21262d"/>
    <rect x="0" y="0" width="794" height="10" fill="url(#langGrad)" clip-path="url(#langBarClip)"/>
  </g>

  <g transform="translate(28,418)">
    <circle cx="4" cy="-4" r="4" fill="#3178c6"/>
    <text class="lang-label" x="14" y="0">TypeScript</text>
