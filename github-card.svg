<svg width="850" height="480" viewBox="0 0 850 480" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .card-border { fill: none; stroke: #30363d; stroke-width: 1; }
      .name { font: 700 22px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #56d364; }
      .handle { font: 400 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
      .term { font: 400 12px 'Consolas', 'Courier New', monospace; fill: #3fb950; }
      .meta { font: 400 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9d1d9; }
      .section { font: 700 14px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #56d364; }
      .track-name { font: 700 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9d1d9; }
      .track-artist { font: 400 12px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
      .lang-label { font: 400 12px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9d1d9; }
      .lang-pct { font: 400 12px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
      .divider { stroke: #21262d; stroke-width: 1; }
      .slot-label { font: 400 10px 'Consolas', 'Courier New', monospace; fill: #8b949e; letter-spacing: 0.5px; }
      .ascii-art { font: 400 10.5px 'Consolas', 'Courier New', monospace; fill: #3fb950; letter-spacing: 0px; }
    </style>
  </defs>

  <!-- Main profile card (original 600px width) -->
  <g>
    <rect class="bg" x="0" y="0" width="600" height="480" rx="12"/>
    <rect class="card-border" x="0.5" y="0.5" width="599" height="479" rx="12"/>

    <!-- Header -->
    <circle cx="34" cy="40" r="4" fill="#3fb950"/>
    <text class="name" x="48" y="46">Renier</text>
    <text class="handle" x="48" y="64">@cryaothicc</text>
    <text class="term" x="48" y="84">&gt; renier@github:~$ whoami_</text>

    <g transform="translate(28,110)">
      <circle cx="6" cy="0" r="7" fill="none" stroke="#8b949e" stroke-width="1.3"/>
      <path d="M6 -3.5 V0 L8.5 2" fill="none" stroke="#8b949e" stroke-width="1.3" stroke-linecap="round"/>
      <text class="meta" x="20" y="4">Joined GitHub Jan 21, 2025</text>
    </g>

    <g transform="translate(28,138)">
      <rect x="0" y="-8" width="12" height="16" rx="2" fill="none" stroke="#8b949e" stroke-width="1.3"/>
      <line x1="0" y1="-3" x2="12" y2="-3" stroke="#8b949e" stroke-width="1"/>
      <text class="meta" x="20" y="4">10 Repositories <tspan class="handle">· 7 public · 3 private</tspan></text>
    </g>

    <!-- Isometric cube cluster: 3x3 diamond (9 cubes), drawn back to front -->
    <g transform="translate(484,53)">
      <path d="M0,-20 L17,-10 L0,0 L-17,-10 Z" fill="#56d364"/>
      <path d="M-17,-10 L0,0 L0,20 L-17,10 Z" fill="#238636"/>
      <path d="M17,-10 L0,0 L0,20 L17,10 Z" fill="#2ea043"/>
      <path d="M-34,0 L-17,10 L-34,20 L-51,10 Z" fill="#56d364"/>
      <path d="M-51,10 L-34,20 L-34,40 L-51,30 Z" fill="#238636"/>
      <path d="M-17,10 L-34,20 L-34,40 L-17,30 Z" fill="#2ea043"/>
      <path d="M34,0 L51,10 L34,20 L17,10 Z" fill="#56d364"/>
      <path d="M17,10 L34,20 L34,40 L17,30 Z" fill="#238636"/>
      <path d="M51,10 L34,20 L34,40 L51,30 Z" fill="#2ea043"/>
      <path d="M-68,20 L-51,30 L-68,40 L-85,30 Z" fill="#56d364"/>
      <path d="M-85,30 L-68,40 L-68,60 L-85,50 Z" fill="#238636"/>
      <path d="M-51,30 L-68,40 L-68,60 L-51,50 Z" fill="#2ea043"/>
      <path d="M0,20 L17,30 L0,40 L-17,30 Z" fill="#56d364"/>
      <path d="M-17,30 L0,40 L0,60 L-17,50 Z" fill="#238636"/>
      <path d="M17,30 L0,40 L0,60 L17,50 Z" fill="#2ea043"/>
      <path d="M68,20 L85,30 L68,40 L51,30 Z" fill="#56d364"/>
      <path d="M51,30 L68,40 L68,60 L51,50 Z" fill="#238636"/>
      <path d="M85,30 L68,40 L68,60 L85,50 Z" fill="#2ea043"/>
      <path d="M-34,40 L-17,50 L-34,60 L-51,50 Z" fill="#56d364"/>
      <path d="M-51,50 L-34,60 L-34,80 L-51,70 Z" fill="#238636"/>
      <path d="M-17,50 L-34,60 L-34,80 L-17,70 Z" fill="#2ea043"/>
      <path d="M34,40 L51,50 L34,60 L17,50 Z" fill="#56d364"/>
      <path d="M17,50 L34,60 L34,80 L17,70 Z" fill="#238636"/>
      <path d="M51,50 L34,60 L34,80 L51,70 Z" fill="#2ea043"/>
      <path d="M0,60 L17,70 L0,80 L-17,70 Z" fill="#56d364"/>
      <path d="M-17,70 L0,80 L0,100 L-17,90 Z" fill="#238636"/>
      <path d="M17,70 L0,80 L0,100 L17,90 Z" fill="#2ea043"/>
    </g>

    <line class="divider" x1="28" y1="180" x2="572" y2="180"/>

    <!-- Suggested tracks -->
    <text class="section" x="28" y="202">Suggested tracks</text>
    <text class="handle" x="28" y="216">From Spotify</text>

    <!-- Track 1: Amazing (Top Left) -->
    <g transform="translate(46,240)">
      <circle r="16" fill="#0a0a0a" stroke="#30363d" stroke-width="1"/>
      <circle r="16" fill="none" stroke="#21262d" stroke-width="0.6"/>
      <circle r="11" fill="none" stroke="#21262d" stroke-width="0.6"/>
      <circle r="6" fill="#3fb950"/>
      <circle r="2" fill="#0d1117"/>
      <text class="track-name" x="30" y="-4">Amazing</text>
      <text class="track-artist" x="30" y="11">Kanye West</text>
    </g>

    <!-- Track 2: Total Praise (Top Right) -->
    <g transform="translate(200,240)">
      <circle r="16" fill="#0a0a0a" stroke="#30363d" stroke-width="1"/>
      <circle r="16" fill="none" stroke="#21262d" stroke-width="0.6"/>
      <circle r="11" fill="none" stroke="#21262d" stroke-width="0.6"/>
      <circle r="6" fill="#3fb950"/>
      <circle r="2" fill="#0d1117"/>
      <text class="track-name" x="30" y="-4">Total Praise</text>
      <text class="track-artist" x="30" y="11">Sunday Service Choir</text>
    </g>

    <!-- Track 3: POWER (Bottom Left) -->
    <g transform="translate(46,296)">
      <circle r="16" fill="#0a0a0a" stroke="#30363d" stroke-width="1"/>
      <circle r="16" fill="none" stroke="#21262d" stroke-width="0.6"/>
      <circle r="11" fill="none" stroke="#21262d" stroke-width="0.6"/>
      <circle r="6" fill="#3fb950"/>
      <circle r="2" fill="#0d1117"/>
      <text class="track-name" x="30" y="-4">POWER</text>
      <text class="track-artist" x="30" y="11">Kanye West</text>
    </g>

    <!-- Track 4: Heaven and Hell (Bottom Right) -->
    <g transform="translate(200,296)">
      <circle r="16" fill="#0a0a0a" stroke="#30363d" stroke-width="1"/>
      <circle r="16" fill="none" stroke="#21262d" stroke-width="0.6"/>
      <circle r="11" fill="none" stroke="#21262d" stroke-width="0.6"/>
      <circle r="6" fill="#3fb950"/>
      <circle r="2" fill="#0d1117"/>
      <text class="track-name" x="30" y="-4">Heaven and Hell</text>
      <text class="track-artist" x="30" y="11">Kanye West</text>
    </g>

    <line class="divider" x1="28" y1="352" x2="572" y2="352"/>

    <!-- Most used languages -->
    <text class="section" x="28" y="376">Most used languages</text>

    <g transform="translate(28,388)">
      <defs>
        <clipPath id="langBarClip">
          <rect x="0" y="0" width="544" height="10" rx="5"/>
        </clipPath>
      </defs>
      <g clip-path="url(#langBarClip)">
        <rect x="0.0" y="0" width="317.3" height="10" fill="#7ee787"/>
        <rect x="320.3" y="0" width="105.9" height="10" fill="#3fb950"/>
        <rect x="429.2" y="0" width="105.9" height="10" fill="#238636"/>
        <rect x="538.1" y="0" width="5.9" height="10" fill="#145a25"/>
      </g>
    </g>

    <g transform="translate(28,416)">
      <circle cx="4" cy="-4" r="4" fill="#7ee787"/>
      <text class="lang-label" x="14" y="0">TypeScript</text>
      <text class="lang-pct" x="90" y="0">59.3%</text>

      <circle cx="144" cy="-4" r="4" fill="#3fb950"/>
      <text class="lang-label" x="154" y="0">HTML</text>
      <text class="lang-pct" x="200" y="0">19.8%</text>

      <circle cx="254" cy="-4" r="4" fill="#238636"/>
      <text class="lang-label" x="264" y="0">CSS</text>
      <text class="lang-pct" x="302" y="0">19.8%</text>

      <circle cx="356" cy="-4" r="4" fill="#145a25"/>
      <text class="lang-label" x="366" y="0">JavaScript</text>
      <text class="lang-pct" x="436" y="0">1.1%</text>
    </g>

    <text class="term" x="28" y="452">&gt; end_of_transmission_</text>
  </g>

  <!-- Vertical Pepe ASCII container -->
  <g transform="translate(610,0)">
    <rect class="bg" x="0" y="0" width="240" height="480" rx="12"/>
    <rect class="card-border" x="0.5" y="0.5" width="239" height="479" rx="12"/>

    <circle cx="34" cy="40" r="4" fill="#3fb950"/>
    <text class="name" x="48" y="46">Status</text>
    <text class="term" x="28" y="70">&gt; 7chan.txt_</text>

    <!-- Pepe ASCII Art Positioned at X: 143 -->
    <g transform="translate(143, 130) scale(0.94, 1.8)">
      <text class="ascii-art" text-anchor="middle" style="white-space: pre;">
        <tspan x="0" dy="0">⠄⠄⠄⠄⠄⠄⠄⣠⣴⣶⣿⣿⡿⠶⠄⠄⠄⠄⠐⠒⠒⠲⠶⢄⠄⠄⠄⠄⠄</tspan>
        <tspan x="0" dy="1.2em">⠄⠄⠄⠄⠄⣠⣾⡿⠟⠋⠁⠄⢀⣀⡀⠤⣦⢰⣤⣶⢶⣤⣤⣈⣆⠄⠄⠄⠄</tspan>
        <tspan x="0" dy="1.2em">⠄⠄⠄⠄⢰⠟⠁⠄⢀⣤⣶⣿⡿⠿⣿⣿⣊⡘⠲⣶⣷⣶⠶⠶⠶⠦⠤⡀⠄</tspan>
        <tspan x="0" dy="1.2em">⠄⠔⠊⠁⠁⠄⠄⢾⡿⣟⡯⣖⠯⠽⠿⠛⠛⠭⠽⠊⣲⣬⠽⠟⠛⠛⠭⢵⣂</tspan>
        <tspan x="0" dy="1.2em">⡎⠄⠄⠄⠄⠄⠄⠄⢙⡷⠋⣴⡆⠄⠐⠂⢸⣿⣿⡶⢱⣶⡇⠄⠐⠂⢹⣷⣶</tspan>
        <tspan x="0" dy="1.2em">⡇⠄⠄⠄⠄⣀⣀⡀⠄⣿⡓⠮⣅⣀⣀⣐⣈⣭⠤⢖⣮⣭⣥⣀⣤⣤⣭⡵⠂</tspan>
        <tspan x="0" dy="1.2em">⣤⡀⢠⣾⣿⣿⣿⣿⣷⢻⣿⣿⣶⣶⡶⢖⣢⣴⣿⣿⣟⣛⠿⠿⠟⣛⠉⠄⠄</tspan>
        <tspan x="0" dy="1.2em">⣿⡗⣼⣿⣿⣿⣿⡿⢋⡘⠿⣿⣿⣷⣾⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣷⡀⠄</tspan>
        <tspan x="0" dy="1.2em">⣿⠱⢿⣿⣿⠿⢛⠰⣞⡛⠷⣬⣙⡛⠻⠿⠿⠿⣿⣿⣿⣿⣿⣿⣿⠿⠛⣓⡀</tspan>
        <tspan x="0" dy="1.2em">⢡⣾⣷⢠⣶⣿⣿⣷⣌⡛⠷⣦⣍⣛⠻⠿⢿⣶⣶⣶⣦⣤⣴⣶⡶⠾⠿⠟⠁</tspan>
        <tspan x="0" dy="1.2em">⣿⡟⣡⣿⣿⣿⣿⣿⣿⣿⣷⣦⣭⣙⡛⠓⠒⠶⠶⠶⠶⠶⠶⠶⠶⠿⠟⠄⠄</tspan>
      </text>
    </g>
    
    <!-- Bottom text aligned to the left side -->
    <text class="term" x="28" y="420">&gt; feels_good_man_</text>
  </g>
</svg>
