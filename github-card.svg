    <circle cx="204" cy="-4" r="4" fill="#e34c26"/>
    <text class="lang-label" x="214" y="0">HTML</text>
    <text class="lang-pct" x="260" y="0">19.8%</text>

    <circle cx="374" cy="-4" r="4" fill="#563d7c"/>
    <text class="lang-label" x="384" y="0">CSS</text>
    <text class="lang-pct" x="422" y="0">19.8%</text>

    <circle cx="536" cy="-4" r="4" fill="#f1e05a"/>
    <text class="lang-label" x="546" y="0">JavaScript</text>
    <text class="lang-pct" x="616" y="0">1.1%</text>
