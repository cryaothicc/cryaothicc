        <tspan x="0" dy="1.2em">⣿⠱⢿⣿⣿⠿⢛⠰⣞⡛⠷⣬⣙⡛⠻⠿⠿⠿⣿⣿⣿⣿⣿⣿⣿⠿⠛⣓⡀</tspan>
        <tspan x="0" dy="1.2em">⢡⣾⣷⢠⣶⣿⣿⣷⣌⡛⠷⣦⣍⣛⠻⠿⢿⣶⣶⣶⣦⣤⣴⣶⡶⠾⠿⠟⠁</tspan>
        <tspan x="0" dy="1.2em">⣿⡟⣡⣿⣿⣿⣿⣿⣿⣿⣷⣦⣭⣙⡛⠓⠒⠶⠶⠶⠶⠶⠶⠶⠶⠿⠟⠄⠄</tspan>
      </text>
    </g>

    <text class="term" x="28" y="420">&gt; feels_good_man_</text>
  </g>
</svg>
