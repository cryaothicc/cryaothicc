      <linearGradient id="langGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#3178c6"/>
        <stop offset="57%" stop-color="#3178c6"/>
        <stop offset="61%" stop-color="#e34c26"/>
        <stop offset="77%" stop-color="#e34c26"/>
        <stop offset="81%" stop-color="#563d7c"/>
        <stop offset="97%" stop-color="#563d7c"/>
        <stop offset="99%" stop-color="#f1e05a"/>
        <stop offset="100%" stop-color="#f1e05a"/>
      </linearGradient>
