    <circle r="13" fill="none" stroke="#21262d" stroke-width="0.6"/>
    <circle r="8" fill="none" stroke="#21262d" stroke-width="0.6"/>
    <circle r="6" fill="#1DB954"/>
    <circle r="2" fill="#0d1117"/>
    <text class="track-name" x="34" y="-4">Amazing</text>
    <text class="track-artist" x="34" y="12">Kanye West</text>
  </g>

  <g transform="translate(46,306)">
    <circle r="18" fill="#0a0a0a" stroke="#30363d" stroke-width="1"/>
    <circle r="18" fill="none" stroke="#21262d" stroke-width="0.6"/>
    <circle r="13" fill="none" stroke="#21262d" stroke-width="0.6"/>
    <circle r="8" fill="none" stroke="#21262d" stroke-width="0.6"/>
    <circle r="6" fill="#1DB954"/>
    <circle r="2" fill="#0d1117"/>
    <text class="track-name" x="34" y="-4">POWER</text>
    <text class="track-artist" x="34" y="12">Kanye West</text>
  </g>

  <line class="divider" x1="28" y1="352" x2="822" y2="352"/>

  <!-- Most used languages (bar width 544 -> 794) -->
