<svg width="850" height="480" viewBox="0 0 850 480" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .card-border { fill: none; stroke: #30363d; stroke-width: 1; }
      .name { font: 700 22px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #58a6ff; }
      .handle { font: 400 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
      .term { font: 400 12px 'Consolas', 'Courier New', monospace; fill: #3fb950; }
      .meta { font: 400 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9d1d9; }
      .section { font: 700 14px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #58a6ff; }
      .track-name { font: 700 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9d1d9; }
      .track-artist { font: 400 12px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
      .lang-label { font: 400 12px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9d1d9; }
      .lang-pct { font: 400 12px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
      .divider { stroke: #21262d; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="850" height="480" rx="12"/>
  <rect class="card-border" x="0.5" y="0.5" width="849" height="479" rx="12"/>

  <!-- Header -->
  <circle cx="34" cy="40" r="4" fill="#3fb950"/>
  <text class="name" x="48" y="46">Renier</text>
  <text class="handle" x="48" y="64">@cryaothicc</text>
  <text class="term" x="48" y="84">&gt; renier@github:~$ whoami_</text>

  <g transform="translate(28,110)">
    <circle cx="6" cy="0" r="7" fill="none" stroke="#8b949e" stroke-width="1.3"/>
    <path d="M6 -3.5 V0 L8.5 2" fill="none" stroke="#8b949e" stroke-width="1.3" stroke-linecap="round"/>
    <text class="meta" x="20" y="4">Joined GitHub Jan 21, 2025</text>
  </g>

  <g transform="translate(28,138)">
    <rect x="0" y="-8" width="12" height="16" rx="2" fill="none" stroke="#8b949e" stroke-width="1.3"/>
    <line x1="0" y1="-3" x2="12" y2="-3" stroke="#8b949e" stroke-width="1"/>
    <text class="meta" x="20" y="4">8 Repositories <tspan class="handle">· 5 public · 3 private</tspan></text>
  </g>

